<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Metal Sonic: Resurgence</title>

    <!-- Puter.js -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070d;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* GAME */

        #game-container {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #10182b;
        }

        #gameCanvas {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* TITLE SCREEN */

        #title-screen {
            position: absolute;
            inset: 0;

            z-index: 10;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                radial-gradient(
                    circle,
                    #31558c 0%,
                    #172746 45%,
                    #05070d 100%
                );
        }

        .title-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .small-title {
            color: #168cff;

            font-size: clamp(20px, 4vw, 42px);

            font-weight: 900;
            font-style: italic;

            letter-spacing: 8px;

            text-shadow:
                4px 4px 0 #000,
                0 0 25px #168cff;
        }

        h1 {
            margin-top: 5px;

            color: white;

            font-size: clamp(50px, 10vw, 120px);

            font-weight: 900;
            font-style: italic;

            line-height: 0.85;

            letter-spacing: -5px;

            text-shadow:
                6px 6px 0 #000,
                0 0 35px #168cff;
        }

        .subtitle {
            margin-top: 20px;

            color: #c5d4ec;

            font-size: clamp(9px, 1.4vw, 15px);

            font-weight: bold;

            letter-spacing: 4px;
        }

        /* START BUTTON */

        #start-button {
            margin-top: 40px;

            padding: 16px 50px;

            border: 3px solid white;
            border-radius: 5px;

            background: #168cff;

            color: white;

            font-size: 21px;
            font-weight: 900;

            letter-spacing: 3px;

            cursor: pointer;

            box-shadow:
                0 7px 0 #07519b,
                0 0 30px rgba(22, 140, 255, 0.7);
        }

        #start-button:hover {
            background: #42a7ff;
        }

        #start-button:active {
            transform: translateY(5px);

            box-shadow:
                0 2px 0 #07519b;
        }

        /* CONTROLS */

        .controls {
            display: flex;

            justify-content: center;

            gap: 25px;

            margin-top: 30px;

            color: white;

            font-size: 10px;

            font-weight: bold;
        }

        .controls div {
            display: flex;

            flex-direction: column;

            gap: 4px;
        }

        .controls span {
            color: #8194b5;

            font-size: 8px;

            letter-spacing: 1px;
        }

        .version {
            margin-top: 25px;

            color: #526783;

            font-size: 8px;

            letter-spacing: 3px;
        }

        /* LOADING */

        #loading {
            position: absolute;
            inset: 0;

            z-index: 20;

            display: none;

            align-items: center;
            justify-content: center;

            background: #05070d;

            color: white;
        }

        .loading-content {
            width: 280px;

            text-align: center;
        }

        .loading-title {
            color: #168cff;

            font-size: 24px;

            font-weight: 900;

            font-style: italic;

            letter-spacing: 4px;
        }

        .loading-text {
            margin-top: 10px;

            color: #9aa9c4;

            font-size: 10px;

            letter-spacing: 2px;
        }

        .loading-bar {
            width: 100%;

            height: 8px;

            margin-top: 18px;

            background: #17243b;

            border: 1px solid #304568;
        }

        .loading-bar-fill {
            width: 100%;
            height: 100%;

            background: #168cff;
        }

        /* HUD */

        #hud {
            position: absolute;

            top: 20px;
            left: 25px;

            z-index: 5;

            display: none;

            color: white;

            font-weight: bold;

            text-shadow:
                3px 3px 0 #000;
        }

        .hud-character {
            margin-bottom: 7px;

            color: #168cff;

            font-size: 14px;

            letter-spacing: 2px;
        }

        .hud-row {
            display: flex;

            justify-content: space-between;

            gap: 30px;

            font-size: 16px;
        }

        /* PAUSE */

        #pause-button {
            position: absolute;

            top: 20px;
            right: 25px;

            z-index: 30;

            display: none;

            width: 42px;
            height: 42px;

            border: 2px solid white;

            border-radius: 4px;

            background: rgba(0, 0, 0, 0.5);

            color: white;

            font-size: 18px;

            font-weight: 900;
        }

        @media (max-width: 600px) {

            .small-title {
                font-size: 18px;
                letter-spacing: 4px;
            }

            h1 {
                font-size: 50px;
                letter-spacing: -3px;
            }

            .subtitle {
                font-size: 8px;
                letter-spacing: 2px;
            }

            #start-button {
                padding: 13px 35px;
                font-size: 17px;
            }

            .controls {
                gap: 10px;
                font-size: 8px;
            }

            .controls span {
                font-size: 6px;
            }
        }
    </style>
</head>

<body>

<div id="game-container">

    <canvas
        id="gameCanvas"
        width="424"
        height="240">
    </canvas>


    <!-- TITLE SCREEN -->

    <div id="title-screen">

        <div class="title-content">

            <div class="small-title">
                METAL SONIC
            </div>

            <h1>
                RESURGENCE
            </h1>

            <div class="subtitle">
                A FAN-MADE SONIC ADVENTURE
            </div>

            <button
                id="start-button"
                type="button">
                START GAME
            </button>

            <div class="controls">

                <div>
                    ARROWS
                    <span>MOVE</span>
                </div>

                <div>
                    SPACE
                    <span>JUMP</span>
                </div>

                <div>
                    SHIFT
                    <span>PLASMA DASH</span>
                </div>

                <div>
                    E
                    <span>OVERDRIVE</span>
                </div>

            </div>

            <div class="version">
                PROTOTYPE BUILD
            </div>

        </div>

    </div>


    <!-- LOADING SCREEN -->

    <div id="loading">

        <div class="loading-content">

            <div class="loading-title">
                METAL SONIC
            </div>

            <div class="loading-text">
                LOADING RESURGENCE...
            </div>

            <div class="loading-bar">

                <div class="loading-bar-fill"></div>

            </div>

        </div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div class="hud-character">
            METAL SONIC
        </div>

        <div class="hud-row">
            <span>RINGS</span>
            <span id="rings">0</span>
        </div>

        <div class="hud-row">
            <span>SCORE</span>
            <span id="score">0</span>
        </div>

    </div>


    <!-- PAUSE -->

    <button
        id="pause-button"
        type="button">
        II
    </button>

</div>


<!-- GAME -->

<script src="game.js"></script>

</body>
</html>
