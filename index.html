<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Sonic: Resurgence</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">

        <canvas id="gameCanvas" width="640" height="360"></canvas>

        <div id="title-screen">
            <div class="title-content">

                <div class="small-title">METAL SONIC</div>

                <h1>RESURGENCE</h1>

                <div class="subtitle">
                    A FAN-MADE SONIC ADVENTURE
                </div>

                <button id="start-button">
                    START GAME
                </button>

                <div class="controls">
                    <span>← → MOVE</span>
                    <span>SPACE JUMP</span>
                    <span>SHIFT DASH</span>
                </div>

            </div>
        </div>

        <div id="hud">
            RINGS <span id="rings">0</span>
            &nbsp;&nbsp;
            SCORE <span id="score">0</span>
        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
